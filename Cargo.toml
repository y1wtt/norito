[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "markdown", "advanced", "crisp", "x11", "wayland", "image", "svg"] }
norito-model = { path = "crates/norito-model" }
norito-platform = { path = "crates/norito-platform" }
norito-platform-native = { path = "crates/norito-platform-native" }
norito-platform-mock = { path = "crates/norito-platform-mock" }
norito-viewmodel = { path = "crates/norito-viewmodel" }
norito-iced-ext = { path = "crates/norito-iced-ext" }
norito-editor-widget = { path = "crates/norito-editor-widget" }
norito-render = { path = "crates/norito-render" }

[profile.dev]
debug = 1
